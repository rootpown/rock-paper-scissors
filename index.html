<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <header class="header">
                <h1>rock paper scissors</h1>
            </header>
            <div class="modal_window">
                <div id="status_game">
                    <!-- p elems DOM / STATUS-->
                </div>
                <button id="restart_game">Restart</button>
            </div>
            <main class="main">
                <section class="main_section_header">
                    <!-- сpu player -->
                    <div class="main_header_block-left">
                    <h2 class="main_header_title">Player</h2>
                        <div id="block_modelPlayer">
                            lorem
                        </div>
                        <div class="block">
                            <p>count: </p>
                            <p id="countPlayer"></p>
                        </div>
                    </div>
                    <div class="main_header_block-right">
                        <h2 class="main_header_title">CPU</h2>
                        <div id="block_modelCPU"></div>
                        <div class="block">
                            <p>count: </p>
                            <p id="countCPU"> </p>
                        </div>
                    </div>
                </section>
                <!-- body -->
                <section class="main_body_choice">
                        <div class="main_body_choice-row">
                                <ul class="main_body_choice-obj">
                                    <li id="paper"><img src="imgs/280-2802166_rock-paper-scissors-clipart-png-download.png" alt=""></li>
                                    <li id="rock"><img src="imgs/502-5025794_rock-paper-scissors-clipart-hd-png-download-Photoroom.png" alt=""></li>
                                    <li id="scissors"><img src="imgs/rock-paper-scissors-rock-paper-scissors-clipart-1176494-Photoroom.png" alt=""></li>
                                </ul>
                        </div>
                </section>
            </main>
            <footer class="main_footer">
                <div class="footer_row">
                    <p> Copyright ©</p>

                        <img src="imgs/25231.png" alt="github">   
                        rootpown
                         </a>
                </div>
